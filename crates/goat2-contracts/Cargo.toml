[package]
name = "goat2-contracts"
version = "0.0.0"
description = "Wire and disk contracts shared by the host and the TypeScript UI (ts-rs, JSON Schema)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
schemars = "1.2"

[dev-dependencies]
jsonschema = { version = "0.63", default-features = false }
