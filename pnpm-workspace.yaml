packages:
  - apps/*
  - packages/*

# Versions follow goat-si/goat's catalog where it pins one (effect 4.1.3, react 19.3.0,
# electron 44.10.1). goat typechecks with @tsc-rs/typescript and builds with vite-plus;
# GOAT 2 starts on stock typescript + vite (TODO: decide whether to adopt vite-plus).
catalog:
  effect: 4.1.3
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": 19.3.3
  "@types/react-dom": 19.3.0
  "@types/node": 24.12.4
  typescript: 5.9.3
  vite: 8.4.0
  "@vitejs/plugin-react": 6.3.0
  electron: 44.10.1
  vitest: 5.1.2
  jsdom: 31.0.1
  "@playwright/test": 1.65.1
  "@electron/osx-sign": 2.7.0

onlyBuiltDependencies:
  - electron

# v1 lift (devlog 070): v1's patches for packages the lifted code uses, copied byte-identical from
# goat-si/goat 916b5ccc patches/; micromark is pinned like v1 so its patch applies to the transitive copy.
overrides:
  micromark: 4.0.2
  mdast-util-math: 3.0.0

patchedDependencies:
  micromark@4.0.2: patches/micromark@4.0.2.patch
  mdast-util-math@3.0.0: patches/mdast-util-math@3.0.0.patch
  "@legendapp/list@3.3.5": patches/@legendapp__list@3.3.5.patch
  "@pierre/diffs@1.7.0-beta.3": patches/@pierre__diffs@1.7.0-beta.3.patch
