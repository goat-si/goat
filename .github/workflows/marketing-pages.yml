name: Marketing site preview

# Builds apps/marketing for the review preview at https://goat-si.github.io/goat/ on pushes to dev
# that can change the site. The preview is noindex. The build job can only read; only the deploy
# job can write to Pages. .vite-hooks/goat-workflow-guard.mjs pins this whole file, so any change
# here needs a review and a new pinned hash.
#
# Nothing runs until the repository variable GOAT_MARKETING_PAGES is "true". Set it once Pages is
# enabled with GitHub Actions as its source and the account has Actions storage for the artifact.

on:
  push:
    branches: [dev]
    paths:
      - apps/marketing/**
      - packages/shared/**
      - packages/contracts/**
      - scripts/install.sh
      - scripts/install.ps1
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/marketing-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'goat-si/goat' && github.ref == 'refs/heads/dev' && vars.GOAT_MARKETING_PAGES == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@goat/marketing...

      # --no-cache: the task cache does not track these variables, so a cached build could
      # carry another base path.
      - name: Build
        env:
          MARKETING_SITE_URL: https://goat-si.github.io
          MARKETING_BASE_PATH: /goat
          MARKETING_NOINDEX: "1"
        run: vp run --no-cache --filter @goat/marketing build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/marketing/dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
