name: Marketing site preview

# Builds apps/marketing for the review preview at https://goat-si.github.io/goat/ and publishes it
# to the gh-pages branch, which GitHub Pages serves. The preview is noindex. The build job can only
# read. The deploy job, the only one that can write, runs no repository code: it restores the built
# site, commits exactly those files to gh-pages, and asks Pages to rebuild. .vite-hooks/goat-workflow-guard.mjs pins this
# whole file, so any change here needs a review and a new pinned hash.
#
# Nothing runs until the repository variable GOAT_MARKETING_PAGES is "true".
#
# To recover a failed deploy, re-run all jobs: the deploy job only accepts the cache entry its own
# run attempt saved. If gh-pages was already pushed and only the Pages build request failed, request
# the build by hand: gh api --method POST repos/goat-si/goat/pages/builds
#
# The build reaches the deploy job through the Actions cache under a key unique to this run, not an
# artifact: goat-si's artifact storage quota is full, and the cache has its own per-repository limit.

on:
  push:
    branches: [dev]
    paths:
      - apps/marketing/**
      - packages/shared/**
      - packages/contracts/**
      - scripts/install.sh
      - scripts/install.ps1
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/marketing-pages.yml
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer run waits instead of racing the push to gh-pages.
concurrency:
  group: marketing-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'goat-si/goat' && github.ref == 'refs/heads/dev' && vars.GOAT_MARKETING_PAGES == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@goat/marketing...

      # The package script runs directly: `vp run` loads every workspace package's config, and the
      # filtered install leaves apps/server's config unresolvable.
      - name: Build
        working-directory: apps/marketing
        env:
          MARKETING_SITE_URL: https://goat-si.github.io
          MARKETING_BASE_PATH: /goat
          MARKETING_NOINDEX: "1"
        run: node --run build

      # Pages runs Jekyll unless the site root has .nojekyll, and Jekyll drops the _astro directory.
      - name: Mark the site as prebuilt
        run: touch apps/marketing/dist/.nojekyll

      - name: Hand the site to the deploy job
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/marketing/dist
          key: marketing-pages-${{ github.run_id }}-${{ github.run_attempt }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    steps:
      - name: Restore the built site
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/marketing/dist
          key: marketing-pages-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      # The restored files are data from the build job. Git runs with a fresh repository outside
      # them and with no hooks, so nothing in the site can configure or run code with the token.
      # The commit's parent is the current gh-pages tip, so the push never rewrites history; the
      # branch starts as an orphan on the first deploy.
      - name: Publish to gh-pages
        id: publish
        working-directory: apps/marketing/dist
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # restore can fall back to a prefix match; publish only this run's exact build.
          if [ "$CACHE_HIT" != "true" ]; then
            echo "The cache entry for this run was not restored exactly." >&2
            exit 1
          fi
          for file in index.html 404.html ko/index.html .nojekyll; do
            test -f "$file" || { echo "The restored build has no $file." >&2; exit 1; }
          done
          if [ -n "$(find . \( -name .git -o -name .gitattributes -o -name .gitmodules \) -print -quit)" ]; then
            echo "The restored build contains Git metadata; refusing to publish it." >&2
            exit 1
          fi
          export GIT_DIR="$RUNNER_TEMP/gh-pages.git"
          export GIT_WORK_TREE="$PWD"
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL=/dev/null
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git init -q -b gh-pages
          git config core.hooksPath /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          tree="$(git write-tree)"
          parent=""
          if git -c http.extraheader="$auth" ls-remote --exit-code --heads "$remote" gh-pages >/dev/null; then
            git -c http.extraheader="$auth" fetch -q --depth 1 "$remote" gh-pages
            parent="$(git rev-parse FETCH_HEAD)"
            if [ "$(git rev-parse "${parent}^{tree}")" = "$tree" ]; then
              echo "gh-pages already has this build."
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          commit="$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "Deploy apps/marketing from ${GITHUB_SHA}")"
          git -c http.extraheader="$auth" push -q "$remote" "${commit}:refs/heads/gh-pages"
          echo "Published ${commit} to gh-pages."
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN does not start a Pages build, so ask for one. Before Pages is
      # set up (the first run creates gh-pages, then a maintainer points Pages at it), there is no
      # build to request; the run says so with a warning. Pages pointing elsewhere is an error.
      - name: Request a Pages build
        if: steps.publish.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          errors="$(mktemp)"
          if ! branch="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .source.branch 2>"$errors")"; then
            if grep -q "HTTP 404" "$errors"; then
              echo "::warning::GitHub Pages is not set up yet. gh-pages is updated; point Pages at gh-pages / (root) to serve it."
              exit 0
            fi
            cat "$errors" >&2
            exit 1
          fi
          if [ "$branch" != "gh-pages" ]; then
            echo "::error::GitHub Pages serves the ${branch} branch, not gh-pages."
            exit 1
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --jq .status
